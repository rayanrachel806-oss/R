<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;800&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1f3;--ink:#12303a;--card:#fff;--acc:#4b3f8f;--mut:#4f6b74;--line:#bcd3d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f26;--ink:#e3eef1;--card:#16303a;--acc:#a99cf0;--mut:#9ab5bd;--line:#2a4954}}
:root[data-theme="dark"]{--bg:#0e1f26;--ink:#e3eef1;--card:#16303a;--acc:#a99cf0;--mut:#9ab5bd;--line:#2a4954}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Work Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Spectral,Georgia,serif;line-height:1.15;margin:0 0 .5em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:6px;padding:8px 16px;flex-wrap:wrap}
nav a{color:inherit;text-decoration:none;padding:6px 12px;border-radius:6px}
nav a:hover,nav a.on{background:rgba(255,255,255,.18)}
.logo{display:flex;align-items:center;gap:8px;font:800 20px Spectral,serif;margin-right:auto;padding:0!important}
.logo img{width:36px;height:36px;border-radius:50%}
main{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.hero{padding:30px 0 10px}.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:800}
.hero p{max-width:60ch;font-size:1.1rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;color:inherit;text-decoration:none;display:block}
.card:hover{border-color:var(--acc)}
.card .fl{float:right;margin-left:10px}.card h3{font-size:1.15rem}.card p{margin:0;font-size:.92rem;color:var(--mut)}
.map{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
a{color:var(--acc)}.btn{display:inline-block;background:var(--acc);color:#fff!important;padding:8px 16px;border-radius:8px;text-decoration:none}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.flag{width:150px;height:100px;border:1px solid var(--line);flex:none;display:block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.facts b{display:block;font-size:.8rem;color:var(--mut);font-weight:600}
.news{border-left:4px solid var(--acc);background:var(--card);padding:12px 16px;margin:12px 0;border-radius:0 8px 8px 0}
a.news{display:block;color:inherit;text-decoration:none}a.news:hover{border-left-color:var(--ink)}.news small{color:var(--mut)}.news h3{margin:2px 0 4px;font-size:1.2rem}.news p{margin:0}
.mapbox{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:grab;background:#a7cdd6}.mapbox:active{cursor:grabbing}.mapbox img{display:block;width:100%;transform-origin:0 0;user-select:none;-webkit-user-drag:none}.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}.mapctl button{width:36px;height:36px;border:0;border-radius:6px;background:var(--ink);color:var(--bg);font-size:20px;line-height:1;cursor:pointer}.maphint{font-size:.85rem;color:var(--mut);margin:6px 0 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.fcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;display:block;position:relative}.fcard:hover{border-color:var(--acc)}.fcard img.ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.fcard .bd{padding:12px 14px 14px}.fcard h3{font-size:1.15rem;margin-bottom:.3em}.fcard p{margin:0;font-size:.92rem;color:var(--mut)}.fcard .fb{position:absolute;top:8px;right:8px;border:2px solid #fff;border-radius:3px;line-height:0;box-shadow:0 1px 4px rgba(0,0,0,.35)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;text-decoration:none;color:inherit;font-size:.9rem}.chip:hover{border-color:var(--acc)}.chip svg{border-radius:2px;border:1px solid var(--line)}.cimg{width:100%;max-height:340px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin:8px 0 0;display:block}
h2{margin-top:1.6em}
</style></head><body>

function em(e,x,y,r,f){if(e=="star"){let p=[];for(let i=0;i<16;i++){const a=Math.PI*i/8-Math.PI/2,k=i%2?r*.45:r;p.push((x+k*Math.cos(a)).toFixed(1)+","+(y+k*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(" ")}" fill="${f}"/>`}
if(e=="diamond")return `<polygon points="${x},${y-r} ${x+r*.7},${y} ${x},${y+r} ${x-r*.7},${y}" fill="${f}"/>`;
if(e=="ring")return `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${f}" stroke-width="${r*.3}"/>`;
if(e=="tri")return `<polygon points="${x},${y-r} ${x+r},${y+r*.8} ${x-r},${y+r*.8}" fill="${f}"/>`;
let p=[];for(let i=0;i<6;i++){const a=Math.PI*i/3;p.push((x+r*Math.cos(a)).toFixed(1)+","+(y+r*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(" ")}" fill="${f}"/>`}
function flag(f,w=150,h=100){const[t,a,b,c,e]=f;let s=`<rect width="150" height="100" fill="${a}"/>`,x=75,y=50,r=15;
if(t=="chev"){s+=`<polygon points="0,0 50,0 95,50 50,100 0,100 45,50" fill="${b}"/>`;x=118;r=14}
else if(t=="diag"){s+=`<polygon points="150,0 150,100 0,100" fill="${b}"/>`;x=75;y=50;r=16}
else if(t=="quart"){s+=`<rect width="75" height="50" fill="${b}"/><rect x="75" y="50" width="75" height="50" fill="${b}"/>`;r=17}
else if(t=="bend"){s+=`<polygon points="0,100 0,70 120,0 150,0 150,30 30,100" fill="${b}"/>`;x=36;y=26;r=15}
else if(t=="border"){s+=`<rect x="10" y="10" width="130" height="80" fill="${b}"/><rect x="20" y="20" width="110" height="60" fill="${a}"/>`;r=17}
else if(t=="sun"){s+=`<circle cx="75" cy="100" r="42" fill="${b}"/>`;for(let i=1;i<8;i++){const q=Math.PI*i/8;s+=`<line x1="${75-50*Math.cos(q)}" y1="${100-50*Math.sin(q)}" x2="${75-72*Math.cos(q)}" y2="${100-72*Math.sin(q)}" stroke="${b}" stroke-width="4"/>`}y=82;r=14}
else if(t=="wave"){s+=`<path d="M0 62 Q19 48 37 62 T75 62 T112 62 T150 62 V100 H0Z" fill="${b}"/>`;y=30;r=16}
else if(t=="peaks"){s+=`<polygon points="0,100 32,48 58,78 92,26 122,72 150,52 150,100" fill="${b}"/>`;x=36;y=22;r=12}
else if(t=="vring"){s+=`<rect x="75" width="75" height="100" fill="${b}"/>`;r=18}
return `<svg viewBox="0 0 150 100" width="${w}" height="${h}" role="img" aria-label="Flag">${s}${em(e,x,y,r,c)}</svg>`}

const news=[
["ilmara","Parades fill Pelytonia as party council extends rearmament plan","The National Unity Party announced new factory targets and a border review with its neighbors.","5 Oct 2026",["Tens of thousands of uniformed marchers crossed Pelytonia's main avenue on Sunday as the National Unity Party's Central Council extended its rearmament plan for another five years. State radio called the plan a shield against old humiliations.","Factory quotas for steel, rail and ships were raised, and the council ordered a review of Ilmara's sea borders. Rivals inside the army's High Command and the Security Directorate were both seen on the reviewing stand, each careful not to stand next to the other."]],
["zenovia","Bread queues spark strikes in Zenovian ports","The National Assembly was dissolved again as ministers argued over land reform.","4 Oct 2026",["Dock workers in the southern ports walked out after bread prices doubled in a month. Crowds gathered outside the grain offices, and the army was called in to guard warehouses.","In the capital the President dissolved the National Assembly for the third time this year after ministers split over land reform. Landowners say the peasants must wait, while striking workers and underground pamphleteers say they have waited long enough."]],
["ombovi","Ombovi harvest festival breaks trade records","Port revenues rose as drumming parades opened the season.","3 Oct 2026",["Ombovi's harvest festival opened with a week of drumming parades, and the southern ports reported their best trading week on record. Grain, fruit and dyed textiles filled the quays.","The president praised the stable trade policy in a speech to farmers and merchants. Neighboring Kherhania sent a caravan delegation to sign new market agreements."]],
["kherhania","Kherhanian khan hosts talks between Hulagia and Khovshantia","Caravan routes over the central plateau are expected to reopen.","2 Oct 2026",["The Khan of Kherhania welcomed envoys from Hulagia and Khovshantia to his felt-tent court for talks on grazing rights and tolls. Kherhania, almost entirely landlocked, depends on caravan trade and has made peacemaking its trademark.","Officials say the central plateau routes could reopen within weeks. Both sides left saying they would study the proposal, which the Khan's advisers counted as a success."]],
["harkenia","Pilgrim numbers rise at the Harkenian cathedrals","The bishop-prince blessed a new library wing.","1 Oct 2026",["More pilgrims than in any recent year have arrived at Harkenia's cathedrals this autumn, filling the harbor guesthouses and the roads from the bay.","The bishop-prince blessed a new wing of the scholars' library on Tuesday. Visitors from Zenovia and Statia made up the largest groups, despite unrest at home."]],
["ozarnia","Ozarnian king balances nobles ahead of the cavalry review","Border horses from Kunszia were praised at the spring fairs.","30 Sep 2026",["King of Ozarnia met the great noble houses in a series of closed audiences before this month's cavalry review. Observers say he is again playing rival families against each other.","The Kunszian horse fairs supplied many of the mounts, and breeders praised the quality. Ozarnian castles hosted feasts for visiting delegations."]],
["tumivina","Canoe races draw crowds across the eastern islands","Tumivina and Lontesia agreed on shared fishing waters.","29 Sep 2026",["Hundreds of racing canoes crossed the channel off Tumivina's northern peninsula, watched by crowds from the shore and from small boats.","Delegates from Lontesia attended and, after the races, signed an agreement to share fishing waters between the two island groups. The Tumivinan royal family presented the winners' shell garlands."]],
["statia","Statia tightens customs after smuggling ring is found","Merchant councils promise fair inspections.","28 Sep 2026",["Customs officers in Statia broke up a smuggling ring that moved goods across the Zenovian border. Several traders were detained.","The merchant councils promised fair inspections and said the banking houses would stay neutral. Diplomats from both Zenovia and Harkenia are said to be watching the case closely."]]];

$("nav").innerHTML=`<a class="logo" href="${YT}" target="_blank" rel="noopener" title="RBRICKTECH on YouTube"><img src="${LOGO}" alt="RBRICKTECH logo">@RBRICKTECH</a><a href="#/">Home</a><a href="#/map">World Map</a><a href="#/countries">Countries</a><a href="#/news">World News</a><a href="#/channel">Channel</a>`;
const card=c=>`<a class="card" href="#/c/${c.id}"><span class="fl">${flag(c.fl,54,36)}</span><h3>${c.name}</h3><p>${c.gov}</p></a>`;
function mapBox(){return `<div class="mapbox"><img src="${MAP}" alt="Map of Ironcore" draggable="false"><div class="mapctl"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">&minus;</button><button data-z="reset" aria-label="Reset">&#8634;</button></div></div><p class="maphint">Scroll or pinch to zoom, drag to move, double-click to zoom in.</p>`}
function zoomInit(box){const img=box.querySelector("img"),pts=new Map();let s=1,x=0,y=0,d0=0,s0=1;
const apply=()=>{const w=box.clientWidth,h=box.clientHeight;s=Math.min(8,Math.max(1,s));x=Math.min(0,Math.max(w-w*s,x));y=Math.min(0,Math.max(h-h*s,y));img.style.transform=`translate(${x}px,${y}px) scale(${s})`};
const zoomAt=(cx,cy,ns)=>{ns=Math.min(8,Math.max(1,ns));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;apply()};
box.addEventListener("wheel",e=>{e.preventDefault();const r=box.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,s*(e.deltaY<0?1.25:.8))},{passive:false});
box.addEventListener("dblclick",e=>{const r=box.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,s*1.8)});
box.addEventListener("pointerdown",e=>{if(e.target.closest(".mapctl"))return;box.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){const [a,b]=[...pts.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);s0=s}});
box.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);if(pts.size==1){x+=e.clientX-o[0];y+=e.clientY-o[1];pts.set(e.pointerId,[e.clientX,e.clientY]);apply()}else{pts.set(e.pointerId,[e.clientX,e.clientY]);const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=box.getBoundingClientRect();if(d0)zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,s0*d/d0)}});
const up=e=>{pts.delete(e.pointerId);d0=0};box.addEventListener("pointerup",up);box.addEventListener("pointercancel",up);
box.querySelector(".mapctl").addEventListener("click",e=>{const z=e.target.dataset.z;if(!z)return;const w=box.clientWidth/2,h=box.clientHeight/2;if(z=="reset"){s=1;x=0;y=0;apply()}else zoomAt(w,h,s*(z=="in"?1.5:1/1.5))})}
function render(){const h=location.hash.slice(1)||"/",p=h.split("/");let o="";
[...document.querySelectorAll("nav a:not(.logo)")].forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+(p[1]=="c"?"/countries":p[1]=="post"?"/news":h)));
if(h=="/")o=`<div class="hero"><h1>Welcome to Ironcore</h1><p>Ironcore is a world of ${C.length} nations spread across two great continents and a scatter of islands. In the west you will find ${C.filter(c=>c.cont=="West").length} nations, from the vast Republic of Zenovia to tiny island clans. In the east, ${C.filter(c=>c.cont=="East").length} nations, from proud khanates to the trade-minded Republic of Ombovi and the island kingdoms of the far sea. Every nation has its own flag, land, people and culture.</p></div>${mapBox()}<h2>Nations to know</h2><p style="color:var(--mut)">A few of the good things Ironcore is known for.</p><div class="fgrid">${FEAT.map(f=>{const c=by(f[0]);return `<a class="fcard" href="#/c/${c.id}"><img class="ph" src="${IMG[c.id]}" alt="${c.name} on the map"><span class="fb">${flag(c.fl,44,29)}</span><div class="bd"><h3>${c.name}</h3><p>${f[1]}</p></div></a>`}).join("")}</div><h2>Western continent</h2><div class="chips">${C.filter(c=>c.cont=="West").map(c=>`<a class="chip" href="#/c/${c.id}">${flag(c.fl,30,20)}${c.name}</a>`).join("")}</div><h2>Eastern continent and islands</h2><div class="chips">${C.filter(c=>c.cont=="East").map(c=>`<a class="chip" href="#/c/${c.id}">${flag(c.fl,30,20)}${c.name}</a>`).join("")}</div>`;
else if(h=="/map")o=`<h1>World Map</h1>${mapBox()}<h2>Western continent</h2><div class="grid">${C.filter(c=>c.cont=="West").map(c=>card(c).replace(c.gov,c.land.split(".")[0]+".")).join("")}</div><h2>Eastern continent and islands</h2><div class="grid">${C.filter(c=>c.cont=="East").map(c=>card(c).replace(c.gov,c.land.split(".")[0]+".")).join("")}</div>`;
else if(h=="/countries")o=`<h1>Countries</h1><div class="grid">${C.map(card).join("")}</div>`;
else if(h=="/channel")o=`<div class="head"><div><h1>RBRICKTECH</h1><p>${"@RBRICKTECH"} on YouTube</p><p><a class="btn" href="${YT}" target="_blank" rel="noopener">Visit the channel</a></p></div><img class="flag" style="width:110px;height:110px;border-radius:50%" src="${LOGO}" alt="RBRICKTECH logo"></div><h2>About the channel</h2><p>RBRICKTECH is a YouTube channel built around technology, creative projects and imagined worlds. This site is the companion atlas for one of those worlds, Ironcore: two continents, ${C.length} nations, their flags, histories and daily news.</p><h2>What you will find</h2><div class="grid"><div class="card"><h3>Tech and builds</h3><p>Projects, tools and experiments explained step by step.</p></div><div class="card"><h3>World-building</h3><p>The nations of Ironcore, from the weak Republic of Zenovia to the one-party Republic of Ilmara.</p></div><div class="card"><h3>Stories and news</h3><p>Invented headlines and events that move the world forward.</p></div></div><h2>Follow along</h2><p>Subscribe at <a href="${YT}" target="_blank" rel="noopener">youtube.com/@RBRICKTECH</a> to see new videos and updates to this atlas.</p>`;
else if(h=="/news")o=`<h1>World News</h1>`+news.map((n,k)=>{const c=by(n[0]);return `<a class="news" href="#/post/${k}"><small>${c.name}, ${n[3]}</small><h3>${n[1]}</h3><p>${n[2]}</p></a>`}).join("");
else if(p[1]=="post"&&news[p[2]]){const n=news[p[2]],c=by(n[0]);o=`<p><a href="#/news">Back to World News</a></p><div class="head"><div><small>${n[3]}</small><h1>${n[1]}</h1><p><a href="#/c/${c.id}">${c.name}</a></p></div><span class="flag">${flag(c.fl,90,60)}</span></div><p style="font-size:1.15rem;color:var(--mut)">${n[2]}</p>${n[4].map(x=>`<p>${x}</p>`).join("")}<h2>More from the world</h2>${news.map((m,k)=>k!=p[2]?`<a class="news" href="#/post/${k}"><small>${by(m[0]).name}</small><h3>${m[1]}</h3></a>`:"").slice(0,3).join("")}`}
else if(p[1]=="c"){const c=by(p[2]);if(c)o=`<div class="head"><div><h1>${c.name}</h1><p>${c.gov}</p></div><span class="flag">${flag(c.fl)}</span></div><div class="facts"><div><b>Capital</b>${c.cap}</div><div><b>Population</b>${c.pop}</div><div><b>Language</b>${c.lang}</div><div><b>Region</b>${c.cont=="West"?"Western":"Eastern"} continent</div></div>${IMG[c.id]?`<img class="cimg" src="${IMG[c.id]}" alt="${c.name} on the map">`:""}<h2>Geography</h2><p>${c.land}</p><h2>People</h2><p>${c.ppl}</p><h2>Culture</h2><p>${c.cul}</p><h2>News</h2>${news.map((n,k)=>n[0]==c.id?`<a class="news" href="#/post/${k}"><small>${n[3]}</small><h3>${n[1]}</h3><p>${n[2]}</p></a>`:"").join("")||"<p>No recent headlines.</p>"}`;}
$("app").innerHTML=o||"<h1>Page not found</h1><a href='#/'>Back home</a>";scrollTo(0,0);document.querySelectorAll(".mapbox").forEach(zoomInit)}
addEventListener("hashchange",render);render();
</script></body></html>
